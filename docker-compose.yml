version: '3.8'
services:
  redis:
    image: redis:7
    restart: "always"

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: chatroom
      POSTGRES_USER: chatroom
      POSTGRES_PASSWORD: chatroom
    restart: "always"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 project.asgi:application
    volumes:
      - .:/app
    restart: "always"
    environment:
      - SITE_URL=${SITE_URL:-http://localhost:8000}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DJANGO_DB_ENGINE=django.db.backends.postgresql
      - DJANGO_DB_NAME=chatroom
      - DJANGO_DB_USER=chatroom
      - DJANGO_DB_PASSWORD=chatroom
      - DJANGO_DB_HOST=db
      - DJANGO_DB_PORT=5432
    depends_on:
      - redis
      - db

  worker:
    build: .
    command: celery -A project worker -l info
    volumes:
      - .:/app
    restart: "always"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DJANGO_DB_ENGINE=django.db.backends.postgresql
      - DJANGO_DB_NAME=chatroom
      - DJANGO_DB_USER=chatroom
      - DJANGO_DB_PASSWORD=chatroom
      - DJANGO_DB_HOST=db
      - DJANGO_DB_PORT=5432
    depends_on:
      - redis
      - db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: "always"
    depends_on:
      - web
      - db

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${NGX_EXTERNAL_PORT:-8000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/usr/share/nginx/html/static:ro
    depends_on:
      - web
      - db
    restart: "always"

volumes:
  postgres_data:
